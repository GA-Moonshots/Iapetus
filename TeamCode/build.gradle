apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// Turn on the commit guard (scripts/hooks/pre-commit) on first sync, so nobody has to remember to.
// Leaves an existing hooksPath alone; no git, or a ZIP download, is silently skipped.
// Why it exists: docs/issue-log.md, 2026-09-22.
if (new File(rootDir, '.git').exists()) try {
    def root = rootDir.path
    def current = providers.exec {
        commandLine 'git', '-C', root, 'config', '--get', 'core.hooksPath'
        ignoreExitValue = true
    }.result.get()
    if (current.exitValue != 0) {
        providers.exec { commandLine 'git', '-C', root, 'config', 'core.hooksPath', 'scripts/hooks' }.result.get()
    }
} catch (Exception ignored) { }

repositories {
    maven {
        url = 'https://maven.brott.dev/'
    }

    maven {
        url = 'https://mymaven.bylazar.com/releases'
    }

    // SolversLib, and Sloth (which Pedro's AutoTune uses to find our tuners)
    maven {
        url = "https://repo.dairy.foundation/releases"
    }

    maven {
        url = "https://repo.dairy.foundation/snapshots"
    }

    // Pedro Pathing 3 lives on Maven Central, which build.dependencies.gradle already adds.
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    // SolversLib: the command scheduler and gamepad helpers, nothing else. Its pedroPathing
    // module is deliberately left out: our drive commands talk to Pedro directly, so a
    // SolversLib release that lags a Pedro release can't strand us.
    implementation "org.solverslib:core:0.3.6"

    // Pedro Pathing 3: core + REV hub hardware, and AutoTune (see utils/Tuning.java)
    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.0'

    // Panels Dashboard. Held at 1.0.12: 1.0.13's only change is field plugin 1.0.7, which shipped
    // without its web files, so the Field tab (the robot overlay) vanishes. Check before bumping:
    // docs/updating-from-upstream.md.
    implementation "com.bylazar:fullpanels:1.0.12"
}
